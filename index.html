<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Songs Collection</title>
<style>
html,body{margin:0}
body{background:#0f1218;color:#f2efe8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:26px;margin:24px 0 4px}
p{color:#aaa;margin:0 0 18px}
a.card{display:block;background:#1b212c;border-left:5px solid #ffb703;border-radius:10px;padding:16px;margin:0 0 12px;color:#f2efe8;text-decoration:none}
a.card b{display:block;font-size:19px}
a.card span{color:#aaa;font-size:14px}
a:focus-visible{outline:2px solid #ffb703;outline-offset:2px}

/* full-screen viewer */
#viewer{position:fixed;inset:0;background:#0f1218;display:none;flex-direction:column;z-index:10}
#viewer.open{display:flex}
#bar{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
#back{background:#ffb703;color:#000;border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600}
#frame{flex:1;width:100%;border:0;background:#0f1218}
</style>
</head>
<body>
<script src="disable_rightclick.js"></script>
<h1>My Songs Collection</h1>
<p>Choose a page to see its song list.</p>

<a class="card" href="https://raamaprabhu.github.io/Songs_test/mp3.html"><b>Audio Songs - Play in the Background </b><span></span></a>
<a class="card" href="tamil01.html"><b>Tamil Songs (video)</b><span></span></a>
<a class="card" href="hindi01.html"><b>Hindi Songs (video)</b><span></span></a>
<a class="card" href="Bhakthi.html"><b>Bhakthi Songs (video)</b><span></span></a>
<a class="card" href="SivanSongs.html"><b>Sivan Songs (for Pradosham) (video)</b><span></span></a>

<div id="viewer">
  <div id="bar"><button id="back">← Back</button></div>
  <iframe id="frame" allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>
</div>

<script>
const viewer = document.getElementById("viewer");
const frame  = document.getElementById("frame");

function openPage(url) {
  frame.src = url;
  viewer.classList.add("open");
  history.pushState({open:true}, "", location.href);   // phone Back button closes viewer
}
function closePage() {
  viewer.classList.remove("open");
  frame.src = "about:blank";                            // stops the audio/video
}

document.querySelectorAll("a.card").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    openPage(a.getAttribute("href"));
  });
});

document.getElementById("back").onclick = () => history.back();
window.addEventListener("popstate", closePage);
</script>
</body>
</html>
